name: Deploy (production)

# Deploys the production branch to Cloudflare Workers — gated (issue #110):
#   1. `verify` re-runs the full check suite (format, lint, typecheck, unit +
#      browser tests, migration safety) *and* e2e (`run_e2e: true`) for the
#      exact deployed commit. PRs and `dev` pushes run the same suite (incl.
#      e2e) via ci.yml; this re-verification pins the deployed SHA.
#   2. `deploy` requires the GitHub `production` environment approval before it
#      runs, and records the deployed commit (environment deployment + step
#      summary + GIT_COMMIT_SHA Worker var).
#
# Every release: reconcile committed migrations with Neon manually
# (`pnpm db:verify:prod`) before approval. Review and apply any PENDING migrations
# with `pnpm db:migrate:prod -- --yes`, then require EXACT — see docs/DEPLOYMENT.md.
#
# Requires one repository secret named CLOUDFLARE_API_TOKEN.
#   Create at: Cloudflare dashboard -> My Profile -> API Tokens
#   -> "Edit Cloudflare Workers" template (scope to this account).
#   Add it with:  gh secret set CLOUDFLARE_API_TOKEN --repo MartinoPolo/prejemesi
# The CLOUDFLARE_ACCOUNT_ID repo variable (an identifier, not a secret) is set
# via gh and read below.

on:
    push:
        branches: [production]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    verify:
        uses: ./.github/workflows/checks.yml
        with:
            run_e2e: true

    migration-review:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Confirm production target
              run: |
                  if [ "$GITHUB_REF_NAME" != "production" ]; then
                    echo "Production deployments must target the production branch, not $GITHUB_REF_NAME." >&2
                    exit 1
                  fi
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Validate complete migration manifest
              run: pnpm check:migration-history
            - name: Summarize migration gate
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  {
                    echo "## Migration gate"
                    echo ""
                    echo "Target: \`${{ github.sha }}\` on \`${{ github.ref_name }}\`"
                    echo ""
                    echo "Local manifest: \`$(pnpm --silent check:migration-history)\`"
                    echo ""
                    echo "### ⛔ Production database not checked"
                    echo ""
                    echo "This job validates committed migration history only. It has no production database credentials."
                    echo "Before approving the environment deployment, run these commands from a clean checkout at the target SHA:"
                    echo ""
                    echo '```bash'
                    echo "pnpm db:verify:prod"
                    echo "pnpm db:migrate:prod -- --yes  # only when PENDING migrations were reviewed and authorized"
                    echo "pnpm db:verify:prod            # must report EXACT"
                    echo '```'
                    echo ""
                  } >> "$GITHUB_STEP_SUMMARY"

                  if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
                    NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "${{ github.sha }}" -- 'drizzle/*.sql')
                    if [ -n "$NEW_MIGRATIONS" ]; then
                      {
                        echo "New migration files in this push:"
                        echo ""
                        echo "$NEW_MIGRATIONS" | sed 's/^/- `/;s/$/`/'
                      } >> "$GITHUB_STEP_SUMMARY"
                    else
                      echo "No new migration files in this push. Production reconciliation is still mandatory." >> "$GITHUB_STEP_SUMMARY"
                    fi
                  else
                    echo "Manual dispatch: no push delta is available. Review the complete manifest and reconcile production before approval." >> "$GITHUB_STEP_SUMMARY"
                  fi

    deploy:
        needs: [verify, migration-review]
        runs-on: ubuntu-latest
        # Requires the GitHub `production` environment with a required reviewer:
        # the deployment waits for explicit approval and records the deployed
        # commit in the environment's deployment history.
        environment:
            name: production
            url: https://prejemesi.cz
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Verify Sentry production configuration
              run: |
                  for variable in PUBLIC_SENTRY_DSN SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
                    if [ -z "${!variable}" ]; then
                      echo "$variable must be configured for production monitoring." >&2
                      exit 1
                    fi
                  done
              env:
                  PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
            - name: Build and upload Sentry source maps
              run: pnpm run build
              env:
                  PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
                  SENTRY_RELEASE: ${{ github.sha }}
                  SENTRY_UPLOAD_SOURCE_MAPS: 'true'
            - name: Deploy to Cloudflare Workers
              run:
                  pnpm exec wrangler deploy --var GIT_COMMIT_SHA:${{ github.sha }} --var
                  PUBLIC_SENTRY_DSN:${PUBLIC_SENTRY_DSN}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
                  PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
            - name: Record deployed commit
              run: |
                  {
                    echo "## Deployed"
                    echo ""
                    echo "- Commit: \`${{ github.sha }}\`"
                    echo "- Worker: \`prejemesi\` → https://prejemesi.cz"
                    echo "- Var: \`GIT_COMMIT_SHA=${{ github.sha }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
