name: CI

# Push to `production` is intentionally not listed: deploy.yml runs the same
# reusable checks as its `verify` job for the exact deployed commit (issue #110).
#
# e2e runs here too (`run_e2e: true`): the full suite, including the Playwright
# e2e job, gates every PR and `dev` push so regressions are caught before the
# merge rather than only at the production deploy gate. deploy.yml still re-runs
# the same suite for the exact deployed commit.

on:
    pull_request:
        branches: [dev, production]
        types: [opened, synchronize, reopened, labeled]
    push:
        branches: [dev]

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        if: github.event_name == 'push' || github.event.action != 'labeled'
        uses: ./.github/workflows/checks.yml
        with:
            run_e2e: true

    performance-report:
        if: >-
            github.event_name == 'pull_request' &&
            (startsWith(github.head_ref, 'perf/') ||
            contains(github.event.pull_request.labels.*.name, 'performance-report'))
        continue-on-error: true
        runs-on: ubuntu-latest
        timeout-minutes: 30
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: mysecretpassword
                    POSTGRES_DB: local
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U root -d local"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        env:
            DATABASE_URL: postgres://root:mysecretpassword@localhost:5432/local
            # CI-only secret; production uses the Cloudflare-stored secret.
            AUTH_SECRET: ci-only-performance-secret-0000000000000000
            ORIGIN: http://localhost:8402
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout base
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  path: performance-base
            - name: Checkout head
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  path: performance-head
            - uses: pnpm/action-setup@v4
              with:
                  version: 11.7.0
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: |
                      performance-base/pnpm-lock.yaml
                      performance-head/pnpm-lock.yaml
            - name: Install base dependencies
              continue-on-error: true
              working-directory: performance-base
              run: pnpm install --frozen-lockfile
            - name: Install head dependencies
              continue-on-error: true
              working-directory: performance-head
              run: pnpm install --frozen-lockfile
            - name: Install Google Chrome
              continue-on-error: true
              working-directory: performance-head
              run: pnpm exec playwright install --with-deps chrome
            - name: Test performance reporter
              continue-on-error: true
              working-directory: performance-head
              run: pnpm run test:performance-report
            # Each revision is measured against the schema created by its own committed
            # migrations. Running base first lets head apply only forward migrations;
            # do not reset, push, or seed this database.
            - name: Apply base database migrations
              continue-on-error: true
              working-directory: performance-base
              run: pnpm run db:migrate
            - name: Collect base production diagnostics
              continue-on-error: true
              run: node performance-head/scripts/production-performance.mjs collect --project performance-base --output performance-reports/base.json --port 8401 --commit ${{ github.event.pull_request.base.sha }} --runs 5
            - name: Apply head database migrations
              continue-on-error: true
              working-directory: performance-head
              run: pnpm run db:migrate
            - name: Collect head production diagnostics
              continue-on-error: true
              run: node performance-head/scripts/production-performance.mjs collect --project performance-head --output performance-reports/head.json --port 8402 --commit ${{ github.event.pull_request.head.sha }} --runs 5
            - name: Compare production diagnostics
              continue-on-error: true
              run: node performance-head/scripts/production-performance.mjs compare --base performance-reports/base.json --head performance-reports/head.json --output performance-reports/summary.md
            - name: Upload performance reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: production-performance-reports
                  path: |
                      performance-reports/base.json
                      performance-reports/head.json
                      performance-reports/summary.md
                  retention-days: 14
                  if-no-files-found: warn
            - name: Add report to job summary
              if: always()
              continue-on-error: true
              run: cat performance-reports/summary.md >> "$GITHUB_STEP_SUMMARY"
            - name: Update performance PR comment
              if: always()
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const marker = '<!-- production-performance-report -->';
                      let body;
                      try { body = fs.readFileSync('performance-reports/summary.md', 'utf8'); }
                      catch (error) { body = `${marker}\n## Production performance delta report\n\n⚠️ Report generation failed: ${error.message}`; }
                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
                      const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body?.includes(marker));
                      if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      else await github.rest.issues.createComment({ owner, repo, issue_number, body });
