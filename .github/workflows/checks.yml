name: Checks

# Reusable verification suite. Called by ci.yml (PRs + dev pushes) and by
# deploy.yml (production), so a production deploy always verifies the exact
# commit being deployed (issue #110).
#
# The e2e job runs whenever a caller passes `run_e2e: true`. Both callers do:
# ci.yml (PRs + `dev` pushes) and deploy.yml (production). The `run_e2e` input
# is retained (default `false`) so this suite stays reusable for a fast-only
# caller. Production deploys require e2e via REQ-1.

on:
    workflow_call:
        inputs:
            run_e2e:
                type: boolean
                default: false

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - uses: actions/cache@v4
              with:
                  path: .eslintcache
                  key:
                      eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs')
                      }}-${{ github.sha }}
                  restore-keys: |
                      eslint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs') }}-
            - run: pnpm run cf:types
            # Formatting runs after generated files are prepared; independent static checks
            # then execute concurrently, with ESLint reusing its content-based cache.
            - run: pnpm run check:all

    unit_tests:
        name: unit-tests
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chrome
            # Unit tests + Vitest browser-mode component tests.
            - run: pnpm exec vitest run --coverage

    e2e:
        if: ${{ inputs.run_e2e }}
        runs-on: ubuntu-latest
        timeout-minutes: 35
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4]
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: mysecretpassword
                    POSTGRES_DB: local
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U root -d local" --health-interval 5s --health-timeout
                    5s --health-retries 20
        env:
            DATABASE_URL: postgres://root:mysecretpassword@localhost:5432/local
            # CI-only secret; production uses the Cloudflare-stored secret.
            AUTH_SECRET: ci-only-e2e-secret-0000000000000000
            ORIGIN: http://localhost:5173
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec playwright install --with-deps chrome chromium
            # Apply the committed migrations (production path) instead of
            # `db:push`, so e2e also fails when migrations lag behind schema.ts.
            - run: pnpm run db:migrate
            # Most specs register fresh users via the API, but admin-release-reservation.spec.ts
            # (issue #213) depends on the seeded personas (petr@test.cz, tomas@test.cz). Seed is
            # idempotent, so this is safe to run unconditionally.
            #
            # seed.ts is executed directly via tsx (no Vite), so it needs the generated
            # `$lib` path mapping (`svelte-kit sync`) and the compiled Paraglide runtime
            # (`paraglide:compile`, gitignored) already on disk before it runs — the `checks`
            # job produces both as a side effect of `check:all`, but this is a separate runner.
            - run: pnpm run paraglide:compile
            - run: pnpm exec svelte-kit sync
            - run: pnpm run db:seed
            # The database-backed server suite only needs one matrix runner; the Playwright
            # suite itself is split evenly across all four isolated PostgreSQL services.
            - if: ${{ matrix.shard == 1 }}
              run: pnpm exec vitest run --project server
            # The real-browser-zoom regression loads an unpacked Chromium extension,
            # which requires headed mode; provide a virtual display on Linux CI.
            - run: xvfb-run --auto-servernum pnpm run test:e2e --shard=${{ matrix.shard }}/4
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report-shard-${{ matrix.shard }}
                  path: test-results/
                  retention-days: 7

    # Stable branch-protection target. The caller job and this reusable job
    # are reported as `checks / required` on PRs and dev pushes.
    required:
        name: required
        if: ${{ always() }}
        needs: [checks, unit_tests, e2e]
        runs-on: ubuntu-latest
        steps:
            - name: Verify required checks
              env:
                  CHECKS_RESULT: ${{ needs.checks.result }}
                  UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
                  E2E_RESULT: ${{ needs.e2e.result }}
                  RUN_E2E: ${{ inputs.run_e2e }}
              run: |
                  if [ "$CHECKS_RESULT" != "success" ]; then
                    echo "Static checks ended with: $CHECKS_RESULT"
                    exit 1
                  fi
                  if [ "$UNIT_TESTS_RESULT" != "success" ]; then
                    echo "Unit and browser tests ended with: $UNIT_TESTS_RESULT"
                    exit 1
                  fi
                  if [ "$RUN_E2E" = "true" ] && [ "$E2E_RESULT" != "success" ]; then
                    echo "Production E2E checks ended with: $E2E_RESULT"
                    exit 1
                  fi
